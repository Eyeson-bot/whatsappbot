name: JavaGoat-WhatsApp-Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Create package-lock.json if missing
        run: |
          if [ ! -f package-lock.json ]; then
            echo "📦 Generating package-lock.json..."
            npm install --package-lock-only
          fi

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund || npm install
          else
            npm install
          fi

      - name: Create sessions directory
        run: mkdir -p sessions

      - name: Restore Session Cache
        uses: actions/cache@v4
        with:
          path: sessions/
          key: sessions-${{ github.run_id }}-${{ github.run_number }}
          restore-keys: |
            sessions-

      - name: Start WhatsApp Bot
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: node index.js
        continue-on-error: true

      - name: Save Session Cache
        if: always()
        uses: actions/cache@v4
        with:
          path: sessions/
          key: sessions-${{ github.run_id }}-${{ github.run_number }}

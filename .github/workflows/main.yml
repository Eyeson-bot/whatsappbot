name: JavaGoat-WhatsApp-Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes (not every 5 hours)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # GitHub Actions max runtime
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Restore Session Cache
        uses: actions/cache@v3
        with:
          path: sessions/
          key: wabot-sessions-${{ github.run_id }}
          restore-keys: |
            wabot-sessions-

      - name: Start WhatsApp Bot
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: npm start
        continue-on-error: true  # IMPORTANT: Don't fail on errors

      - name: Save Session Cache
        uses: actions/cache@v3
        with:
          path: sessions/
          key: wabot-sessions-${{ github.run_id }}
